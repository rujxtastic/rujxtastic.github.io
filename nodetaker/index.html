<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Node-Taker</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

<style>
:root{
  --bg:#0f1115; --panel:#161a21; --card:#1c222c; --line:#2a3240;
  --text:#e6e9ef; --muted:#8b95a5; --accent:#5b9dff; --danger:#ff5c6c;
  --grid:#1e2530;
}
[data-theme="light"]{
  --bg:#f6f7fb; --panel:#ffffff; --card:#ffffff; --line:#dfe3ea;
  --text:#1a1f29; --muted:#6b7585; --accent:#2f6fe0; --danger:#d8384a;
  --grid:#e8ecf2;
}
[data-theme="pink"]{
  --bg:#1a0f17; --panel:#241419; --card:#2c1a21; --line:#4a2b35;
  --text:#f7e6ee; --muted:#b98ba0; --accent:#ff6fb0; --danger:#ff5c6c;
  --grid:#2e1a22;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px}
button{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);
  border-radius:8px;padding:6px 10px;cursor:pointer;transition:background .12s,border-color .12s}
button:hover{border-color:var(--accent)}
button.danger{color:var(--danger);border-color:var(--danger)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.primary:hover{filter:brightness(1.1)}

#app{display:flex;flex-direction:column;height:100%}

#bar{height:50px;flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:0 12px;
  background:var(--panel);border-bottom:1px solid var(--line);z-index:20;overflow-x:auto}
#bar .brand{font-weight:700;margin-right:10px;white-space:nowrap;letter-spacing:.02em}
#bar .brand .dot{color:var(--accent)}
#bar .chk{display:flex;align-items:center;gap:5px;color:var(--muted);white-space:nowrap;user-select:none}
#bar .sep{width:1px;height:24px;background:var(--line);flex:0 0 auto}
.status{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}

#main{flex:1;display:flex;min-height:0}

#viewport{flex:1;position:relative;overflow:hidden;cursor:grab;
  background-color:var(--bg);
  background-image:radial-gradient(circle at 1px 1px,var(--grid) 1px,transparent 0);
  background-size:24px 24px}
#viewport.panning{cursor:grabbing}

#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}

.node{position:absolute;width:300px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;box-shadow:0 6px 22px rgba(0,0,0,.35);overflow:hidden;
  transition:border-color .15s,box-shadow .15s}
.node.selected{border-color:var(--accent);
  box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent),0 10px 30px rgba(0,0,0,.45)}
.node-head{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:grab;
  background:color-mix(in srgb,var(--text) 4%,transparent);border-bottom:1px solid var(--line);user-select:none}
.node-head:active{cursor:grabbing}
.node-head .title{flex:1;font-weight:600;font-size:13.5px;line-height:1.3;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:10px;text-transform:uppercase;letter-spacing:.06em;padding:2px 6px;
  border-radius:999px;border:1px solid;font-weight:700;white-space:nowrap}
.toggle{background:transparent;border:none;padding:0 4px;font-size:14px;line-height:1;
  color:var(--muted);cursor:pointer}
.toggle:hover{color:var(--text);background:transparent}

.node-body{padding:10px 12px;font-size:13px;line-height:1.55;white-space:pre-wrap;
  word-wrap:break-word;max-height:260px;overflow:hidden;position:relative}
.node-body::after{content:"";position:absolute;left:0;right:0;bottom:0;height:28px;
  background:linear-gradient(transparent,var(--card));pointer-events:none}
.node.selected .node-body{max-height:none}
.node.selected .node-body::after{display:none}
.node-body .katex{font-size:1.02em}
.node-body .katex-display{margin:.4em 0;overflow-x:auto;overflow-y:hidden}

.nodelink{color:var(--accent);text-decoration:none;border-bottom:1px dotted var(--accent);
  cursor:pointer}
.nodelink:hover{background:color-mix(in srgb,var(--accent) 15%,transparent)}

#zoomhud{position:absolute;right:14px;bottom:14px;display:flex;align-items:center;gap:6px;
  background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);
  border-radius:10px;padding:5px 7px;backdrop-filter:blur(6px);z-index:5}
#zoomhud button{padding:3px 9px}
#zoomhud span{font-size:12px;color:var(--muted);min-width:44px;text-align:center}

#panel{width:400px;flex:0 0 400px;background:var(--panel);border-left:1px solid var(--line);
  overflow-y:auto;padding:14px 14px 60px}
#panel .hint{color:var(--muted);line-height:1.6;font-size:13px}
#panel .hint code{background:var(--bg);padding:1px 5px;border-radius:4px;color:var(--accent);font-size:12px}
.p-head{display:flex;align-items:baseline;gap:8px;margin-bottom:12px}
.p-title{font-weight:700}
.p-id{font-size:11px;color:var(--muted);background:var(--bg);padding:1px 6px;border-radius:4px}
.lbl{display:block;margin:12px 0 5px;font-size:11.5px;text-transform:uppercase;
  letter-spacing:.07em;color:var(--muted);font-weight:600}
.lbl code{text-transform:none;letter-spacing:0;color:var(--accent)}
.inp{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;
  color:var(--text);padding:8px 10px;font:inherit;outline:none}
.inp:focus{border-color:var(--accent)}
select.inp{cursor:pointer}
textarea.inp{min-height:230px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,
  Consolas,monospace;font-size:12.5px;line-height:1.6;white-space:pre;overflow-wrap:normal;
  overflow-x:auto}
.small{padding:5px 8px;font-size:12.5px}
.row{margin-top:6px}
.preview{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;
  min-height:52px;font-size:13px;line-height:1.55;white-space:pre-wrap;word-wrap:break-word;
  max-height:320px;overflow:auto}
.preview .katex{font-size:1.02em}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);
  border-radius:999px;padding:3px 4px 3px 10px;font-size:12px}
.chip button{background:transparent;border:none;padding:0 5px;font-size:14px;color:var(--muted);
  line-height:1;cursor:pointer}
.chip button:hover{color:var(--danger);background:transparent}
.muted{color:var(--muted);font-size:12px}
.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px}
.tabs button{background:transparent;border:none;border-bottom:2px solid transparent;
  border-radius:0;padding:8px 10px;color:var(--muted);font-weight:600;font-size:12.5px}
.tabs button.active{color:var(--text);border-bottom-color:var(--accent)}
.calc-row{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.calc-out{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;
  font-size:13px;min-height:44px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word;
  overflow-x:auto}
.calc-out .katex{font-size:1.05em}
.latex-box{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;
  white-space:pre-wrap;word-wrap:break-word;margin-top:6px;color:var(--accent)}
.shortcut-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px}
.shortcut-grid button{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:12px;padding:6px 4px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--accent);color:#fff;padding:8px 18px;border-radius:999px;font-size:13px;
  opacity:0;pointer-events:none;transition:opacity .2s;z-index:100;font-weight:600}
.toast.show{opacity:1}
</style>
</head>
<body data-theme="dark">
<div id="app">
  <div id="bar">
    <span class="brand">🔢 Node<span class="dot">·</span>Taker</span>
    <button id="btn-open" title="Pick a folder to sync notes to (Chrome/Edge)">📂 Open folder</button>
    <button id="btn-export" title="Download all notes as a zip">💾 Export ZIP</button>
    <button id="btn-import" title="Load notes from a zip">📥 Import ZIP</button>
    <span class="sep"></span>
    <button id="btn-new">＋ Node</button>
    <button id="btn-arrange">⟲ Arrange</button>
    <button id="btn-collapse-all">⊟</button>
    <button id="btn-expand-all">⊞</button>
    <span class="sep"></span>
    <label class="chk" title="Show note bodies on the graph">bodies <input type="checkbox" id="chk-bodies" checked></label>
    <label class="chk" title="Colour theme">theme
      <select id="sel-theme" class="inp small" style="width:auto;padding:3px 6px">
        <option value="dark">dark</option>
        <option value="light">light</option>
        <option value="pink">pink</option>
      </select>
    </label>
    <span class="status" id="status"></span>
  </div>

  <div id="main">
    <div id="viewport">
      <div id="world"><svg id="edges"></svg></div>
      <div id="zoomhud">
        <button id="z-out" title="Zoom out">−</button>
        <span id="z-val">100%</span>
        <button id="z-in" title="Zoom in">+</button>
        <button id="z-fit" title="Fit all">⌂</button>
      </div>
    </div>
    <aside id="panel"></aside>
  </div>
</div>
<div id="toast" class="toast"></div>

<script>
(function(){
'use strict';

/* =========================================================
   0.  Constants & helpers
   ========================================================= */
const $  = s => document.querySelector(s);
const viewport = $('#viewport');
const world    = $('#world');
const edgesSvg = $('#edges');
const panel    = $('#panel');
const statusEl = $('#status');
const toastEl  = $('#toast');

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => (
  {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const uid = () => 'n' + Date.now().toString(36).slice(-5) + Math.random().toString(36).slice(2,6);
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));

const TYPES = ['definition','theorem','lemma','proof','example','note'];
const TYPE_COLOR = {
  definition:'#4da3ff', theorem:'#b07dff', lemma:'#4ddb9a',
  proof:'#ffb84d', example:'#ff7b9c', note:'#8b95a5'
};

/* =========================================================
   Theme
   ========================================================= */
function setTheme(name){
  document.body.setAttribute('data-theme', name);
  try{ localStorage.setItem('nodetaker.theme', name); }catch(e){}
}
function loadTheme(){
  let t = 'dark';
  try{ t = localStorage.getItem('nodetaker.theme') || 'dark'; }catch(e){}
  if (!['dark','light','pink'].includes(t)) t = 'dark';
  setTheme(t);
  const sel = $('#sel-theme'); if (sel) sel.value = t;
}

/* =========================================================
   Toast
   ========================================================= */
let toastTimer = null;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1600);
}

/* =========================================================
   1.  State
   ========================================================= */
const nodes = Object.create(null);
let selectedId = null;
let lockedId   = null;
let dirHandle  = null;
let showBodies = true;
const cam = { x: 0, y: 0, z: 1 };
let activeTab = 'node';

function newNode(o){
  o = o || {};
  return {
    id:       o.id || uid(),
    title:    o.title || 'Untitled',
    type:     TYPES.indexOf(o.type) >= 0 ? o.type : 'note',
    parent:   o.parent || null,
    links:    Array.isArray(o.links) ? o.links.slice() : [],
    x:        typeof o.x === 'number' ? o.x : 0,
    y:        typeof o.y === 'number' ? o.y : 0,
    collapsed: !!o.collapsed,
    body:     o.body || ''
  };
}

function childrenOf(id){
  const out = [];
  for (const k in nodes) if (nodes[k].parent === id) out.push(nodes[k]);
  return out;
}
function isDescendant(a, b){
  let cur = nodes[a];
  while (cur && cur.parent){
    if (cur.parent === b) return true;
    cur = nodes[cur.parent];
  }
  return false;
}
function visibleNodes(){
  const out = [];
  const roots = Object.keys(nodes).map(k => nodes[k])
                      .filter(n => !n.parent || !nodes[n.parent]);
  const stack = roots.slice();
  const seen = new Set();
  while (stack.length){
    const n = stack.pop();
    if (seen.has(n.id)) continue;
    seen.add(n.id);
    out.push(n);
    if (!n.collapsed) for (const c of childrenOf(n.id)) stack.push(c);
  }
  return out;
}
const nodeEl = id => world.querySelector('.node[data-id="' + id + '"]');

/* =========================================================
   2.  Text / LaTeX rendering
   ========================================================= */
function formatBody(text){
  let html = esc(text);
  html = html.replace(/\[\[([^\]\|]+)(?:\|([^\]]+))?\]\]/g, function(m, id, label){
    id = id.trim();
    const t = nodes[id];
    const lbl = (label != null ? label : (t ? t.title : id)).trim();
    return '<a href="#" class="nodelink" data-target="' + esc(id) + '">' + esc(lbl) + '</a>';
  });
  return html;
}

function renderMath(el){
  if (typeof window.renderMathInElement !== 'function') return;
  try{
    window.renderMathInElement(el, {
      delimiters: [
        {left:'$$',  right:'$$',  display:true},
        {left:'\\[', right:'\\]', display:true},
        {left:'$',   right:'$',   display:false},
        {left:'\\(', right:'\\)', display:false}
      ],
      throwOnError: false,
      ignoredTags: ['script','noscript','style','textarea','pre','code']
    });
  }catch(e){ console.warn('KaTeX:', e); }
}

/* =========================================================
   3.  Graph rendering
   ========================================================= */
function buildNodeEl(n){
  const el = document.createElement('div');
  el.className = 'node' + (n.id === selectedId ? ' selected' : '');
  el.dataset.id = n.id;
  el.style.left = n.x + 'px';
  el.style.top  = n.y + 'px';

  const c = TYPE_COLOR[n.type] || TYPE_COLOR.note;
  const kids = childrenOf(n.id);

  const head = document.createElement('div');
  head.className = 'node-head';
  head.innerHTML =
    '<span class="badge" style="color:' + c + ';border-color:' + c + '55;background:' + c + '1a">' +
      esc(n.type) + '</span>' +
    '<span class="title"></span>' +
    (kids.length ? '<button class="toggle" title="Collapse / expand">' +
                   (n.collapsed ? '▸' : '▾') + '</button>' : '');
  head.querySelector('.title').textContent = n.title;
  el.appendChild(head);

  if (showBodies && n.body.trim()){
    const b = document.createElement('div');
    b.className = 'node-body';
    b.innerHTML = formatBody(n.body);
    el.appendChild(b);
    renderMath(b);
  }
  return el;
}

function render(){
  world.querySelectorAll('.node').forEach(el => el.remove());
  const vis = visibleNodes();
  for (let i = 0; i < vis.length; i++) world.appendChild(buildNodeEl(vis[i]));
  requestAnimationFrame(() => drawEdges());
  updateZoomHud();
}

function drawEdges(){
  const vis = visibleNodes();
  const c = {};
  for (const n of vis){
    const el = nodeEl(n.id);
    if (!el) continue;
    c[n.id] = {
      cx: n.x + el.offsetWidth / 2,
      cy: n.y + el.offsetHeight / 2,
      l:  n.x,
      r:  n.x + el.offsetWidth
    };
  }

  let html = '<defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" ' +
             'markerWidth="6" markerHeight="6" orient="auto-start-reverse">' +
             '<path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker></defs>';

  for (const n of vis){
    if (!n.parent || !c[n.parent] || !c[n.id]) continue;
    const a = c[n.parent], b = c[n.id];
    const x1 = a.r, y1 = a.cy, x2 = b.l, y2 = b.cy;
    const mx = (x1 + x2) / 2;
    html += '<path d="M' + x1 + ' ' + y1 + ' C' + mx + ' ' + y1 + ', ' + mx + ' ' + y2 +
            ', ' + x2 + ' ' + y2 + '" fill="none" stroke="var(--line)" stroke-width="2"/>';
  }

  for (const n of vis){
    if (!c[n.id]) continue;
    for (const t of (n.links || [])){
      if (t === n.id || !c[t]) continue;
      const a = c[n.id], b = c[t];
      const mx = (a.cx + b.cx) / 2;
      const my = (a.cy + b.cy) / 2 - 60;
      html += '<path d="M' + a.cx + ' ' + a.cy + ' Q' + mx + ' ' + my + ', ' + b.cx + ' ' + b.cy +
              '" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-dasharray="7 5" ' +
              'opacity="0.7" marker-end="url(#arw)"/>';
    }
  }
  edgesSvg.innerHTML = html;
}

/* =========================================================
   4.  Camera
   ========================================================= */
function applyCamera(animate){
  world.style.transition = animate
    ? 'transform .55s cubic-bezier(.22,.61,.36,1)'
    : 'none';
  world.style.transform =
    'translate(' + cam.x + 'px,' + cam.y + 'px) scale(' + cam.z + ')';
  updateZoomHud();
}
function updateZoomHud(){
  const v = $('#z-val');
  if (v) v.textContent = Math.round(cam.z * 100) + '%';
}
function focusNode(id){
  const el = nodeEl(id);
  if (!el) return;
  const n = nodes[id];
  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  const cx = n.x + el.offsetWidth / 2;
  const cy = n.y + el.offsetHeight / 2;
  cam.x = vw / 2 - cam.z * cx;
  cam.y = vh / 2 - cam.z * cy;
  applyCamera(true);
}
function zoomAt(sx, sy, factor){
  const nz = clamp(cam.z * factor, 0.12, 2.6);
  const wx = (sx - cam.x) / cam.z;
  const wy = (sy - cam.y) / cam.z;
  cam.z = nz;
  cam.x = sx - nz * wx;
  cam.y = sy - nz * wy;
  applyCamera(false);
}
function fitView(){
  const vis = visibleNodes();
  if (!vis.length){ cam.x = 0; cam.y = 0; cam.z = 1; applyCamera(true); return; }
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const n of vis){
    const el = nodeEl(n.id);
    if (!el) continue;
    minX = Math.min(minX, n.x);
    minY = Math.min(minY, n.y);
    maxX = Math.max(maxX, n.x + el.offsetWidth);
    maxY = Math.max(maxY, n.y + el.offsetHeight);
  }
  if (!isFinite(minX)){ cam.x = 0; cam.y = 0; cam.z = 1; applyCamera(true); return; }
  const vw = viewport.clientWidth, vh = viewport.clientHeight, pad = 90;
  const z = Math.min(
    (vw - pad * 2) / Math.max(1, maxX - minX),
    (vh - pad * 2) / Math.max(1, maxY - minY),
    1.15
  );
  cam.z = clamp(z, 0.12, 1.15);
  cam.x = vw / 2 - cam.z * (minX + maxX) / 2;
  cam.y = vh / 2 - cam.z * (minY + maxY) / 2;
  applyCamera(true);
}

/* =========================================================
   5.  Auto-layout
   ========================================================= */
function autoArrange(){
  const GAPY = 34, GAPX = 90;
  let cursor = 0;

  function w(id){ const e = nodeEl(id); return e ? e.offsetWidth  : 300; }
  function h(id){ const e = nodeEl(id); return e ? e.offsetHeight : 90; }

  function place(id, depth, x){
    const n = nodes[id];
    n.x = x;
    const kids = n.collapsed ? [] : childrenOf(id);
    if (!kids.length){
      n.y = cursor;
      cursor += h(id) + GAPY;
    } else {
      for (const k of kids) place(k.id, depth + 1, x + w(id) + GAPX);
      const first = nodes[kids[0].id], last = nodes[kids[kids.length - 1].id];
      const top = first.y;
      const bot = last.y + h(last.id);
      n.y = (top + bot) / 2 - h(id) / 2;
    }
  }

  const roots = Object.keys(nodes).map(k => nodes[k])
                      .filter(n => !n.parent || !nodes[n.parent]);
  for (const r of roots){
    place(r.id, 0, 0);
    cursor += 40;
  }
  render();
  for (const k in nodes) scheduleSave(nodes[k]);
  if (lockedId) requestAnimationFrame(() => focusNode(lockedId));
}

/* =========================================================
   6.  File serialization
   ========================================================= */
const fileName = id => 'node_' + id + '.txt';

function serialize(n){
  const head = [
    'id: ' + n.id,
    'title: ' + String(n.title).replace(/\s*\n\s*/g, ' '),
    'type: ' + n.type,
    'parent: ' + (n.parent || ''),
    'links: ' + (n.links || []).join(', '),
    'x: ' + Math.round(n.x),
    'y: ' + Math.round(n.y),
    'collapsed: ' + (n.collapsed ? 'true' : 'false')
  ].join('\n');
  return head + '\n---\n' + n.body + '\n';
}

function parseNode(text, fname){
  const lines = text.split(/\r?\n/);
  let sep = lines.findIndex(l => l.trim() === '---');
  if (sep === -1) sep = lines.length;
  const head = lines.slice(0, sep);
  const body = lines.slice(sep + 1).join('\n').replace(/\s+$/, '');

  const meta = {};
  for (const line of head){
    const j = line.indexOf(':');
    if (j === -1) continue;
    meta[line.slice(0, j).trim().toLowerCase()] = line.slice(j + 1).trim();
  }
  const id = meta.id || fname.replace(/^node_/, '').replace(/\.txt$/i, '');
  return newNode({
    id: id,
    title: meta.title || 'Untitled',
    type: meta.type,
    parent: meta.parent || null,
    links: meta.links ? meta.links.split(',').map(s => s.trim()).filter(Boolean) : [],
    x: parseFloat(meta.x) || 0,
    y: parseFloat(meta.y) || 0,
    collapsed: meta.collapsed === 'true',
    body: body
  });
}

/* =========================================================
   8.  ZIP export / import
   ========================================================= */
function crc32(bytes){
  let c, table = crc32.table;
  if (!table){
    table = crc32.table = new Uint32Array(256);
    for (let n = 0; n < 256; n++){
      c = n;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      table[n] = c >>> 0;
    }
  }
  let crc = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) crc = (crc >>> 8) ^ table[(crc ^ bytes[i]) & 0xFF];
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

function makeZip(files){
  const enc = new TextEncoder();
  const chunks = [];
  const central = [];
  let offset = 0;

  for (const f of files){
    const nameBytes = enc.encode(f.name);
    const data = f.data;
    const crc = crc32(data);
    const size = data.length;

    const lh = new Uint8Array(30 + nameBytes.length);
    const dv = new DataView(lh.buffer);
    dv.setUint32(0, 0x04034b50, true);
    dv.setUint16(4, 20, true);
    dv.setUint16(6, 0, true);
    dv.setUint16(8, 0, true);
    dv.setUint16(10, 0, true);
    dv.setUint16(12, 0, true);
    dv.setUint32(14, crc, true);
    dv.setUint32(18, size, true);
    dv.setUint32(22, size, true);
    dv.setUint16(26, nameBytes.length, true);
    dv.setUint16(28, 0, true);
    lh.set(nameBytes, 30);

    chunks.push(lh);
    chunks.push(data);

    const cd = new Uint8Array(46 + nameBytes.length);
    const cv = new DataView(cd.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true);
    cv.setUint16(8, 0, true);
    cv.setUint16(10, 0, true);
    cv.setUint16(12, 0, true);
    cv.setUint16(14, 0, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, size, true);
    cv.setUint32(24, size, true);
    cv.setUint16(28, nameBytes.length, true);
    cv.setUint16(30, 0, true);
    cv.setUint16(32, 0, true);
    cv.setUint16(34, 0, true);
    cv.setUint16(36, 0, true);
    cv.setUint32(38, 0, true);
    cv.setUint32(42, offset, true);
    cd.set(nameBytes, 46);
    central.push(cd);

    offset += lh.length + size;
  }

  const centralStart = offset;
  let centralSize = 0;
  for (const c of central){ chunks.push(c); centralSize += c.length; }

  const eocd = new Uint8Array(22);
  const ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(4, 0, true);
  ev.setUint16(6, 0, true);
  ev.setUint16(8, files.length, true);
  ev.setUint16(10, files.length, true);
  ev.setUint32(12, centralSize, true);
  ev.setUint32(16, centralStart, true);
  ev.setUint16(20, 0, true);
  chunks.push(eocd);

  return new Blob(chunks, { type: 'application/zip' });
}

function exportZip(){
  const enc = new TextEncoder();
  const files = [];
  for (const k in nodes){
    const n = nodes[k];
    files.push({ name: fileName(n.id), data: enc.encode(serialize(n)) });
  }
  if (!files.length){ flash('nothing to export', true); return; }

  const readme =
    'Node-Taker export\n' +
    '=================\n\n' +
    'This zip contains one .txt file per node.\n' +
    'To restore: open the app, click "Import ZIP", and select this file.\n' +
    'Node IDs are stable, so links between notes will be preserved.\n';
  files.unshift({ name: 'README.txt', data: enc.encode(readme) });

  const blob = makeZip(files);
  const stamp = new Date().toISOString().slice(0, 10);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'node-taker-' + stamp + '.zip';
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){
    URL.revokeObjectURL(a.href);
    a.remove();
  }, 1000);
  flash('exported ' + (files.length - 1) + ' nodes → zip ✓');
}

async function readZip(file){
  const buf = new Uint8Array(await file.arrayBuffer());
  const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);

  let eocd = -1;
  for (let i = buf.length - 22; i >= Math.max(0, buf.length - 65557); i--){
    if (dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if (eocd < 0) throw new Error('Not a ZIP file (no end-of-central-directory)');

  const total = dv.getUint16(eocd + 10, true);
  const cdSize = dv.getUint32(eocd + 12, true);
  const cdStart = dv.getUint32(eocd + 16, true);
  if (cdSize === 0 && total > 0) throw new Error('ZIP64 not supported');

  const out = [];
  let p = cdStart;
  for (let i = 0; i < total; i++){
    if (dv.getUint32(p, true) !== 0x02014b50) throw new Error('Bad central directory');
    const method   = dv.getUint16(p + 10, true);
    const crc      = dv.getUint32(p + 16, true);
    const compSize = dv.getUint32(p + 20, true);
    const uncompSize = dv.getUint32(p + 24, true);
    const nameLen  = dv.getUint16(p + 28, true);
    const extraLen = dv.getUint16(p + 30, true);
    const commentLen = dv.getUint16(p + 32, true);
    const localOff = dv.getUint32(p + 42, true);
    const name = new TextDecoder().decode(buf.subarray(p + 46, p + 46 + nameLen));
    p += 46 + nameLen + extraLen + commentLen;

    if (name.endsWith('/')) continue;

    if (dv.getUint32(localOff, true) !== 0x04034b50) throw new Error('Bad local header');
    const lNameLen  = dv.getUint16(localOff + 26, true);
    const lExtraLen = dv.getUint16(localOff + 28, true);
    const dataStart = localOff + 30 + lNameLen + lExtraLen;
    let comp = buf.subarray(dataStart, dataStart + compSize);

    let data;
    if (method === 0){
      data = comp;
    } else if (method === 8){
      if (typeof DecompressionStream !== 'function') throw new Error('DecompressionStream unsupported');
      const ds = new DecompressionStream('deflate-raw');
      const stream = new Blob([comp]).stream().pipeThrough(ds);
      data = new Uint8Array(await new Response(stream).arrayBuffer());
    } else {
      throw new Error('Unsupported compression method ' + method);
    }

    if (data.length !== uncompSize) throw new Error('Size mismatch for ' + name);
    if (crc32(data) !== crc) throw new Error('CRC mismatch for ' + name);

    out.push({ name: name, data: data });
  }
  return out;
}

async function importZip(file){
  let entries;
  try{
    entries = await readZip(file);
  }catch(e){
    console.error(e);
    flash('import failed: ' + e.message, true);
    return;
  }

  const parsed = [];
  for (const e of entries){
    if (!/\.txt$/i.test(e.name)) continue;
    if (e.name === 'README.txt') continue;
    try{
      const text = new TextDecoder().decode(e.data);
      const n = parseNode(text, e.name);
      parsed.push(n);
    }catch(err){ console.warn('bad entry', e.name, err); }
  }

  if (!parsed.length){
    flash('no nodes found in zip', true);
    return;
  }

  if (Object.keys(nodes).length){
    if (!confirm('Import ' + parsed.length + ' node(s)?\n\nThis will replace your current notes graph.')) return;
  }

  for (const k in nodes) delete nodes[k];
  for (const n of parsed) nodes[n.id] = n;

  if (dirHandle){
    for (const n of parsed) await writeNode(n);
  } else {
    saveLocal();
  }

  selectedId = null; lockedId = null;
  render();
  renderPanel();
  requestAnimationFrame(fitView);
  flash('imported ' + parsed.length + ' node(s) ✓');
}

/* =========================================================
   10. Calculator — complex & matrix
   ========================================================= */
function parseComplex(s){
  s = String(s).trim().replace(/\s+/g, '');
  if (!s) throw new Error('empty');
  const parts = [];
  let cur = '';
  for (let i = 0; i < s.length; i++){
    const ch = s[i];
    if ((ch === '+' || ch === '-') && i > 0 && !/[eE]/.test(s[i-1])){
      parts.push(cur); cur = ch;
    } else cur += ch;
  }
  parts.push(cur);
  let real = 0, imag = 0;
  for (let p of parts){
    if (!p) continue;
    let sign = 1;
    if (p[0] === '+') { p = p.slice(1); }
    else if (p[0] === '-'){ sign = -1; p = p.slice(1); }
    if (p === '' || p === 'i'){
      imag += sign * (p === 'i' ? 1 : 0);
      if (p === '') real += sign;
      continue;
    }
    if (p.endsWith('i')){
      let c = p.slice(0, -1);
      if (c === '' || c === '*') c = '1';
      imag += sign * parseFloat(c);
    } else {
      real += sign * parseFloat(p);
    }
  }
  if (isNaN(real) || isNaN(imag)) throw new Error('could not parse: ' + s);
  return { re: real, im: imag };
}

function fmtNum(x){
  if (Math.abs(x) < 1e-12) x = 0;
  if (Number.isInteger(x)) return String(x);
  return String(parseFloat(x.toPrecision(10)));
}
function fmtComplex(z){
  const re = fmtNum(z.re), im = fmtNum(Math.abs(z.im));
  if (z.im === 0) return re;
  if (z.re === 0) return (z.im < 0 ? '-' : '') + (im === '1' ? '' : im) + 'i';
  return re + (z.im < 0 ? ' - ' : ' + ') + (im === '1' ? '' : im) + 'i';
}
function complexToLatex(z){
  const re = fmtNum(z.re), im = fmtNum(Math.abs(z.im));
  if (z.im === 0) return re;
  if (z.re === 0) return (z.im < 0 ? '-' : '') + (im === '1' ? '' : im) + 'i';
  return re + (z.im < 0 ? ' - ' : ' + ') + (im === '1' ? '' : im) + 'i';
}

function complexOp(aStr, bStr, op){
  const a = parseComplex(aStr);
  const b = bStr != null && bStr !== '' ? parseComplex(bStr) : null;
  let r;
  switch(op){
    case 'add': r = { re: a.re + b.re, im: a.im + b.im }; break;
    case 'sub': r = { re: a.re - b.re, im: a.im - b.im }; break;
    case 'mul':
      r = { re: a.re*b.re - a.im*b.im, im: a.re*b.im + a.im*b.re }; break;
    case 'div': {
      const d = b.re*b.re + b.im*b.im;
      if (d === 0) throw new Error('division by zero');
      r = { re: (a.re*b.re + a.im*b.im)/d, im: (a.im*b.re - a.re*b.im)/d }; break;
    }
    case 'conj': r = { re: a.re, im: -a.im }; break;
    case 'abs': {
      const m = Math.hypot(a.re, a.im);
      return { latex: fmtNum(m), display: fmtNum(m), isReal: true };
    }
    case 'arg': {
      const ang = Math.atan2(a.im, a.re);
      return { latex: fmtNum(ang), display: fmtNum(ang), isReal: true };
    }
    default: throw new Error('unknown op');
  }
  return { latex: complexToLatex(r), display: fmtComplex(r) };
}

function parseMatrix(s){
  s = String(s).trim();
  s = s.replace(/^\[\[/, '').replace(/\]\]$/, '');
  const rows = s.split(/;|\]\[/);
  const m = rows.map(r =>
    r.replace(/^\[|\]$/g, '').split(/[,\s]+/).filter(Boolean).map(x => {
      const v = parseFloat(x);
      if (isNaN(v)) throw new Error('bad matrix entry: ' + x);
      return v;
    })
  );
  const cols = m[0].length;
  if (!m.every(r => r.length === cols)) throw new Error('ragged matrix');
  return m;
}
function matrixToLatex(m){
  const rows = m.map(r => r.map(fmtNum).join(' & ')).join(' \\\\ ');
  return '\\begin{pmatrix} ' + rows + ' \\end{pmatrix}';
}
function matrixToDisplay(m){
  const rows = m.map(r => r.map(fmtNum).join('  ')).join('\n');
  return rows;
}

function matrixOp(aStr, bStr, op){
  const A = parseMatrix(aStr);
  const B = (bStr != null && bStr.trim() !== '') ? parseMatrix(bStr) : null;
  const n = A.length, m = A[0].length;

  if (op === 'add' || op === 'sub'){
    if (!B) throw new Error('need two matrices');
    if (B.length !== n || B[0].length !== m) throw new Error('size mismatch');
    const C = A.map((row,i) => row.map((v,j) => op === 'add' ? v + B[i][j] : v - B[i][j]));
    return { latex: matrixToLatex(C), display: matrixToDisplay(C), matrix: C };
  }
  if (op === 'mul'){
    if (!B) throw new Error('need two matrices');
    if (m !== B.length) throw new Error('dimension mismatch (' + m + ' vs ' + B.length + ')');
    const C = [];
    for (let i = 0; i < n; i++){
      C.push([]);
      for (let j = 0; j < B[0].length; j++){
        let sum = 0;
        for (let k = 0; k < m; k++) sum += A[i][k]*B[k][j];
        C[i].push(sum);
      }
    }
    return { latex: matrixToLatex(C), display: matrixToDisplay(C), matrix: C };
  }
  if (op === 'transpose'){
    const C = A[0].map((_,j) => A.map(r => r[j]));
    return { latex: matrixToLatex(C), display: matrixToDisplay(C), matrix: C };
  }
  if (op === 'det'){
    if (n !== m) throw new Error('determinant needs a square matrix');
    const d = det(A);
    return { latex: fmtNum(d), display: fmtNum(d), isReal: true };
  }
  if (op === 'inv'){
    if (n !== m) throw new Error('inverse needs a square matrix');
    const d = det(A);
    if (Math.abs(d) < 1e-14) throw new Error('matrix is singular');
    const C = invert(A, d);
    return { latex: matrixToLatex(C), display: matrixToDisplay(C), matrix: C };
  }
  throw new Error('unknown op');
}

function det(M){
  const n = M.length;
  if (n === 1) return M[0][0];
  if (n === 2) return M[0][0]*M[1][1] - M[0][1]*M[1][0];
  let sum = 0;
  for (let j = 0; j < n; j++){
    const sub = M.slice(1).map(r => r.filter((_,k) => k !== j));
    sum += ((j % 2) ? -1 : 1) * M[0][j] * det(sub);
  }
  return sum;
}
function invert(M, d){
  const n = M.length;
  if (n === 1) return [[1/d]];
  const C = [];
  for (let i = 0; i < n; i++){
    C.push([]);
    for (let j = 0; j < n; j++){
      const sub = M.filter((_,r) => r !== i).map(r => r.filter((_,c) => c !== j));
      const sign = ((i + j) % 2) ? -1 : 1;
      C[i].push(sign * det(sub) / d);
    }
  }
  return C[0].map((_,j) => C.map(r => r[j]));
}

  ['\\mathbb{Z}',     'ℤ'],
  ['\\mathbb{Q}',     'ℚ']
];

function renderPanel(){
  if (activeTab === 'node')      renderNodeTab();
  else if (activeTab === 'calc') renderCalcTab();
  else if (activeTab === 'shortcuts') renderShortcutsTab();
  else                            renderSettingsTab();
}

function tabsHTML(active){
  const T = [
    ['node', '📝 Node'],
    ['calc', '🧮 Calculator'],
    ['shortcuts', '∑ LaTeX'],
    ['settings', '⚙ Settings']
  ];
  return '<div class="tabs">' + T.map(([k, label]) =>
    '<button data-tab="' + k + '"' + (k === active ? ' class="active"' : '') + '>' + label + '</button>'
  ).join('') + '</div>';
}
function bindTabs(){
  document.querySelectorAll('.tabs button').forEach(b => {
    b.addEventListener('click', function(){
      activeTab = b.dataset.tab;
      renderPanel();
    });
  });
}

/* ---------- node tab ---------- */
function renderNodeTab(){
  const n = selectedId ? nodes[selectedId] : null;
  const others = Object.keys(nodes).map(k => nodes[k]).filter(o => !n || o.id !== n.id);

  let html = tabsHTML('node');

  if (!n){
    html +=
      '<div class="hint">' +
      '<p><b>No node selected.</b></p>' +
      '<p>• Click a node to focus the camera on it and edit it.<br>' +
      '• Drag a node by its header to move it.<br>' +
      '• Drag the background to pan, scroll to zoom.<br>' +
      '• Click ▾ on a node to collapse / expand its subtree.</p>' +
      '<p><b>Maths:</b> wrap inline maths in <code>$…$</code> and display maths in ' +
      '<code>$$…$$</code>. You can also use <code>\\(…\\)</code> and <code>\\[…\\]</code>.</p>' +
      '<p><b>Links:</b> write <code>[[nodeId|label]]</code> inside a note, or use the ' +
      '"Insert link to…" dropdown. Clicking a link jumps the camera to that node.</p>' +
      '<p><b>Files:</b> Chrome/Edge can sync a folder; every browser can Export/Import ZIP.</p>' +
      '</div>';
    panel.innerHTML = html;
    bindTabs();
    return;
  }

  html +=
    '<div class="p-head"><span class="p-title">Edit node</span>' +
    '<code class="p-id">' + esc(n.id) + '</code></div>' +

    '<label class="lbl">Title</label>' +
    '<input id="f-title" class="inp" value="' + esc(n.title) + '">' +

    '<label class="lbl">Type</label>' +
    '<select id="f-type" class="inp">' +
      TYPES.map(t => '<option value="' + t + '"' + (t === n.type ? ' selected' : '') + '>' + t + '</option>').join('') +
    '</select>' +

    '<label class="lbl">Body — LaTeX in <code>$…$</code> or <code>$$…$$</code>, links <code>[[id|label]]</code></label>' +
    '<div class="row"><select id="f-insert" class="inp small">' +
      '<option value="">Insert link to…</option>' +
      others.map(o => '<option value="' + o.id + '">' + esc(o.title) + '</option>').join('') +
    '</select></div>' +
    '<textarea id="f-body" class="inp" spellcheck="false"></textarea>' +

    '<label class="lbl">Preview</label>' +
    '<div id="f-preview" class="preview"></div>' +

    '<label class="lbl">Outgoing links</label>' +
    '<div id="f-links" class="chips"></div>' +

    '<label class="lbl">Parent</label>' +
    '<select id="f-parent" class="inp">' +
      '<option value="">— none (root) —</option>' +
      others.filter(o => !isDescendant(o.id, n.id)).map(o =>
        '<option value="' + o.id + '"' + (o.id === n.parent ? ' selected' : '') + '>' +
        esc(o.title) + '</option>').join('') +
    '</select>' +

    '<div class="actions">' +
      '<button id="btn-child">＋ Child</button>' +
      '<button id="btn-sibling">＋ Sibling</button>' +
      '<button id="btn-delete" class="danger">🗑 Delete</button>' +
    '</div>' +
    '<div class="actions"><button id="btn-centre">⌖ Centre camera</button></div>';

  panel.innerHTML = html;
  bindTabs();

  const ta = $('#f-body');
  ta.value = n.body;
  updatePreview(n);
  renderLinksChips(n);

  $('#f-title').addEventListener('input', function(e){
    n.title = e.target.value;
    const el = nodeEl(n.id);
    if (el){ const t = el.querySelector('.title'); if (t) t.textContent = n.title; }
    scheduleSave(n);
  });
  $('#f-type').addEventListener('change', function(e){
    n.type = e.target.value;
    render();
    renderPanel();
    scheduleSave(n);
  });

  let bodyTimer = null;
  ta.addEventListener('input', function(){
    n.body = ta.value;
    scheduleSave(n);
    clearTimeout(bodyTimer);
    bodyTimer = setTimeout(function(){ updatePreview(n); updateNodeEl(n); }, 280);
  });

  $('#f-insert').addEventListener('change', function(e){
    const id = e.target.value;
    if (!id) return;
    const t = nodes[id];
    const ins = '[[' + id + '|' + (t ? t.title : id) + ']]';
    const s = ta.selectionStart, en = ta.selectionEnd;
    ta.value = ta.value.slice(0, s) + ins + ta.value.slice(en);
    ta.selectionStart = ta.selectionEnd = s + ins.length;
    ta.focus();
    n.body = ta.value;
    updatePreview(n);
    updateNodeEl(n);
    scheduleSave(n);
    e.target.value = '';
  });
  $('#f-parent').addEventListener('change', function(e){
    n.parent = e.target.value || null;
    render();
    renderPanel();
    scheduleSave(n);
  });
  $('#btn-child').addEventListener('click', function(){ addNode({ parent: n.id }); });
  $('#btn-sibling').addEventListener('click', function(){ addNode({ parent: n.parent }); });
  $('#btn-delete').addEventListener('click', function(){ deleteNode(n.id); });
  $('#btn-centre').addEventListener('click', function(){ lockedId = n.id; focusNode(n.id); });
}

function updatePreview(n){
  const p = $('#f-preview');
  if (!p) return;
  p.innerHTML = formatBody(n.body || '');
  renderMath(p);
}
function renderLinksChips(n){
  const box = $('#f-links');
  if (!box) return;
  box.innerHTML = '';
  if (!n.links.length){
    const s = document.createElement('span');
    s.className = 'muted'; s.textContent = 'none';
    box.appendChild(s);
  }
  n.links.forEach(function(id){
    const chip = document.createElement('span');
    chip.className = 'chip';
    const label = nodes[id] ? nodes[id].title : '(missing ' + id + ')';
    chip.innerHTML = '<span>' + esc(label) + '</span><button title="remove">×</button>';
    chip.querySelector('button').addEventListener('click', function(){
      n.links = n.links.filter(x => x !== id);
      renderLinksChips(n); drawEdges(); scheduleSave(n);
    });
    box.appendChild(chip);
  });
  const sel = document.createElement('select');
  sel.className = 'inp small';
  sel.style.maxWidth = '190px';
  sel.innerHTML = '<option value="">+ add link…</option>' +
    Object.keys(nodes).map(k => nodes[k])
      .filter(o => o.id !== n.id && n.links.indexOf(o.id) === -1)
      .map(o => '<option value="' + o.id + '">' + esc(o.title) + '</option>').join('');
  sel.addEventListener('change', function(){
    if (!sel.value) return;
    n.links.push(sel.value);
    renderLinksChips(n); drawEdges(); scheduleSave(n);
  });
  box.appendChild(sel);
}

  html +=

    '<label class="lbl">Complex numbers</label>' +
    '<div class="calc-row">' +

      '<button data-cop="div">÷</button>' +
      '<button data-cop="conj">conj</button>' +
      '<button data-cop="abs">|z|</button>' +
      '<button data-cop="arg">arg</button>' +
    '</div>' +
    '<label class="lbl">Result</label>' +
    '<div id="c-out" class="calc-out"><span class="muted">pick an operation</span></div>' +
    '<div id="c-latex" class="latex-box" style="display:none"></div>' +
    '<div class="actions" style="margin-top:8px">' +
      '<button id="c-copy" class="small">📋 Copy LaTeX</button>' +
    '</div>' +

    '<label class="lbl" style="margin-top:22px">Matrices</label>' +
    '<input id="m-a" class="inp" placeholder="A: 1 2; 3 4" value="1 2; 3 4">' +
    '<input id="m-b" class="inp" placeholder="B (optional): 5 6; 7 8" value="5 6; 7 8" style="margin-top:6px">' +
    '<div class="actions" style="margin-top:0">' +
      '<button data-mop="add">A+B</button>' +
      '<button data-mop="sub">A−B</button>' +
      '<button data-mop="mul">A·B</button>' +
      '<button data-mop="transpose">Aᵀ</button>' +
      '<button data-mop="det">det A</button>' +
      '<button data-mop="inv">A⁻¹</button>' +
    '</div>' +
    '<label class="lbl">Result</label>' +
    '<div id="m-out" class="calc-out"><span class="muted">pick an operation</span></div>' +
    '<div id="m-latex" class="latex-box" style="display:none"></div>' +
    '<div class="actions" style="margin-top:8px">' +
      '<button id="m-copy" class="small">📋 Copy LaTeX</button>' +
    '</div>' +

    '<div class="hint" style="margin-top:20px">' +
    '<p><b>Matrix format:</b> rows separated by <code>;</code>, entries by spaces or commas. ' +
    'LaTeX-style <code>[[1,2],[3,4]]</code> also works.</p>' +
    '<p><b>Complex format:</b> <code>a+bi</code>, <code>bi</code>, <code>a</code>, <code>i</code>, ' +
    '<code>-2.5+0.5i</code>, etc.</p>' +
    '</div>';

  panel.innerHTML = html;
  bindTabs();

  let cLatex = '', mLatex = '';

  document.querySelectorAll('[data-cop]').forEach(b => b.addEventListener('click', function(){
    try{
      const a = $('#c-a').value, b2 = $('#c-b').value;
      const r = complexOp(a, b2, b.dataset.cop);
      $('#c-out').textContent = r.display;
      cLatex = '$$ ' + (r.isReal ? r.latex : 'z = ' + r.latex) + ' $$';
      const lb = $('#c-latex');
      lb.style.display = 'block';
      lb.textContent = cLatex;
    }catch(e){
      $('#c-out').textContent = '⚠ ' + e.message;
      $('#c-latex').style.display = 'none';
      cLatex = '';
    }
  }));
  $('#c-copy').addEventListener('click', function(){
    if (!cLatex){ toast('nothing to copy'); return; }
    copyText(cLatex, 'complex result LaTeX copied');
  });

  document.querySelectorAll('[data-mop]').forEach(b => b.addEventListener('click', function(){
    try{
      const a = $('#m-a').value, b2 = $('#m-b').value;
      const r = matrixOp(a, b2, b.dataset.mop);
      $('#m-out').textContent = r.display;
      mLatex = '$$ ' + r.latex + ' $$';
      const lb = $('#m-latex');
      lb.style.display = 'block';
      lb.textContent = mLatex;
    }catch(e){
      $('#m-out').textContent = '⚠ ' + e.message;
      $('#m-latex').style.display = 'none';
      mLatex = '';

  }));
  $('#m-copy').addEventListener('click', function(){
    if (!mLatex){ toast('nothing to copy'); return; }
    copyText(mLatex, 'matrix result LaTeX copied');

function copyText(text, ok){
  const done = () => toast(ok || 'copied to clipboard');
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, function(){
      fallbackCopy(text); done();
    });
  } else {
    fallbackCopy(text); done();
  }
}
function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  ta.remove();
}

/* =========================================================
   12. Node operations
   ========================================================= */
function addNode(opts){
  opts = opts || {};
  const n = newNode(opts);
  nodes[n.id] = n;
  if (n.parent && nodes[n.parent]){
    const p = nodes[n.parent];
    p.collapsed = false;
    n.x = p.x + 400;
    n.y = p.y + 150;
    scheduleSave(p);
  }
  writeNodeNow(n);
  render();
  selectAndFocus(n.id);
}

function deleteNode(id){
  const n = nodes[id];
  if (!n) return;
  if (!confirm('Delete "' + n.title + '"?\n\nIts children will move up to its parent.')) return;
  childrenOf(id).forEach(function(c){ c.parent = n.parent; scheduleSave(c); });
  Object.keys(nodes).forEach(function(k){
    const o = nodes[k];
    if (o.links.indexOf(id) !== -1){
      o.links = o.links.filter(x => x !== id);
      scheduleSave(o);
    }
  });
  delete nodes[id];
  if (dirHandle){ dirHandle.removeEntry(fileName(id)).catch(()=>{}); }
  if (selectedId === id) selectedId = null;
  if (lockedId === id)   lockedId = null;
  render();
  renderPanel();
}

function toggleCollapse(id){
  const n = nodes[id];
  if (!n) return;
  n.collapsed = !n.collapsed;
  scheduleSave(n);
  render();
  if (lockedId) requestAnimationFrame(() => focusNode(lockedId));
}

function selectNode(id){
  selectedId = id;
  world.querySelectorAll('.node').forEach(function(el){
    el.classList.toggle('selected', el.dataset.id === id);
  });
  renderPanel();
}
function selectAndFocus(id){
  selectNode(id);
  lockedId = id;
  if (id) requestAnimationFrame(() => focusNode(id));
}
function updateNodeEl(n){
  const el = nodeEl(n.id);
  if (!el) return;
  const t = el.querySelector('.title');
  if (t) t.textContent = n.title;
  const b = el.querySelector('.node-body');
  if (b){ b.innerHTML = formatBody(n.body); renderMath(b); }
  drawEdges();
}

/* =========================================================
   13. Interaction
   ========================================================= */
let drag = null;

viewport.addEventListener('mousedown', function(e){
  if (e.button !== 0) return;
  const toggle = e.target.closest('.toggle');
  const linkEl = e.target.closest('.nodelink');
  const nodeDiv = e.target.closest('.node');

  if (toggle){
    e.preventDefault(); e.stopPropagation();
    toggleCollapse(nodeDiv.dataset.id);
    return;
  }
  if (linkEl){
    e.preventDefault(); e.stopPropagation();
    selectAndFocus(linkEl.dataset.target);
    return;
  }
  if (nodeDiv){
    const id = nodeDiv.dataset.id;
    drag = { type:'node', id, startX:e.clientX, startY:e.clientY,
             origX:nodes[id].x, origY:nodes[id].y, moved:false };
    e.preventDefault();
  } else {
    drag = { type:'pan', startX:e.clientX, startY:e.clientY,
             origX:cam.x, origY:cam.y, moved:false };
    viewport.classList.add('panning');
  }
});

window.addEventListener('mousemove', function(e){
  if (!drag) return;
  const dx = e.clientX - drag.startX;
  const dy = e.clientY - drag.startY;
  if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
  if (drag.type === 'pan'){
    cam.x = drag.origX + dx;
    cam.y = drag.origY + dy;
    applyCamera(false);
  } else {
    const n = nodes[drag.id];
    if (!n) return;
    n.x = drag.origX + dx / cam.z;
    n.y = drag.origY + dy / cam.z;
    const el = nodeEl(drag.id);
    if (el){ el.style.left = n.x + 'px'; el.style.top = n.y + 'px'; }
    drawEdges();
  }
});

window.addEventListener('mouseup', function(){
  if (!drag) return;
  const d = drag;
  drag = null;
  viewport.classList.remove('panning');
  if (d.type === 'node'){
    if (!d.moved) selectAndFocus(d.id);
    else if (nodes[d.id]) scheduleSave(nodes[d.id]);
  } else if (!d.moved){
    selectNode(null);
    lockedId = null;
  }
});

viewport.addEventListener('wheel', function(e){
  e.preventDefault();
  const r = viewport.getBoundingClientRect();
  const factor = Math.exp(-e.deltaY * 0.0016);
  zoomAt(e.clientX - r.left, e.clientY - r.top, factor);
}, { passive: false });

$('#zoomhud').addEventListener('mousedown', e => e.stopPropagation());
$('#z-in').addEventListener('click', () => zoomAt(viewport.clientWidth/2, viewport.clientHeight/2, 1.22));
$('#z-out').addEventListener('click', () => zoomAt(viewport.clientWidth/2, viewport.clientHeight/2, 1/1.22));
$('#z-fit').addEventListener('click', fitView);

});
$('#btn-arrange').addEventListener('click', autoArrange);
$('#btn-collapse-all').addEventListener('click', function(){

    if (childrenOf(k).length) nodes[k].collapsed = true;
    scheduleSave(nodes[k]);
  });

  if (lockedId) requestAnimationFrame(() => focusNode(lockedId));
});

});
$('#chk-bodies').addEventListener('change', function(e){
  showBodies = e.target.checked;
  try{ localStorage.setItem('nodetaker.showBodies', showBodies ? '1' : '0'); }catch(err){}
  render();
  if (lockedId) requestAnimationFrame(() => focusNode(lockedId));
});
$('#sel-theme').addEventListener('change', function(e){ setTheme(e.target.value); });

/* =========================================================
   15. Keyboard
   ========================================================= */
window.addEventListener('keydown', function(e){
  const inField = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's'){
    e.preventDefault();
    Object.keys(nodes).forEach(k => writeNode(nodes[k]));
    saveLocal();
    flash('saved all ✓');
    return;
  }
  if (inField) return;
  if (e.key === 'f' || e.key === 'F') fitView();
  if (e.key === 'a' || e.key === 'A') autoArrange();
  if (e.key === 'n' || e.key === 'N'){
    const parent = selectedId && nodes[selectedId] ? selectedId : null;
    addNode({ parent, title: 'New node', type: 'note' });
  }
});

/* =========================================================
   16. Boot
   ========================================================= */
function boot(){
  loadTheme();
  try{
    const sb = localStorage.getItem('nodetaker.showBodies');
    if (sb === '0'){ showBodies = false; $('#chk-bodies').checked = false; }
  }catch(e){}

  if (!window.showDirectoryPicker){
    flash('Firefox / Safari — use Export ZIP & Import ZIP to save to disk');
  }

  loadLocal();
  if (!Object.keys(nodes).length){
    (async function(){
      await seedStarterGraph();
      render();
      renderPanel();
      requestAnimationFrame(fitView);
    })();
  } else {
    render();
    renderPanel();
    requestAnimationFrame(fitView);
  }

  window.addEventListener('load', function(){
    setTimeout(function(){
      render();
      if (lockedId) focusNode(lockedId);
    }, 80);
  });
}

boot();
